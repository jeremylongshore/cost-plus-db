# CostPlusDB Security Logs Rotation
# Place this file in: /etc/logrotate.d/costplusdb-security
#
# To install:
# sudo cp 001-security/config/logrotate-costplusdb.conf /etc/logrotate.d/costplusdb-security
# sudo chmod 644 /etc/logrotate.d/costplusdb-security

# General security logs (90-day retention)
/home/admincostplus/projects/costplusdb/001-security/logs/*/*.log {
    daily
    rotate 90
    compress
    delaycompress
    missingok
    notifempty
    create 0640 admincostplus admincostplus
    sharedscripts
}

# Audit logs (1-year retention for compliance)
/home/admincostplus/projects/costplusdb/001-security/logs/audit/**/*.log {
    daily
    rotate 365
    compress
    delaycompress
    missingok
    notifempty
    create 0640 admincostplus admincostplus
}

# Backup logs (keep all - only compress)
/home/admincostplus/projects/costplusdb/001-security/logs/backups/*.log {
    daily
    rotate 365
    compress
    delaycompress
    missingok
    notifempty
    create 0640 admincostplus admincostplus
}
