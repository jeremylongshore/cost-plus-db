# PostgreSQL Security Configuration for CostPlusDB
# ================================================
#
# This file contains security-hardened settings for PostgreSQL
# Include this file from main postgresql.conf:
#   include = '/path/to/postgresql-security.conf'
#

# SSL/TLS Configuration
# ---------------------
ssl = on
ssl_cert_file = '/var/lib/postgresql/ssl/server.crt'
ssl_key_file = '/var/lib/postgresql/ssl/server.key'
ssl_ciphers = 'HIGH:MEDIUM:+3DES:!aNULL'
ssl_prefer_server_ciphers = on
ssl_min_protocol_version = 'TLSv1.2'

# Connection Settings
# -------------------
listen_addresses = '*'
port = 5433
max_connections = 100
superuser_reserved_connections = 3

# Authentication
# --------------
password_encryption = scram-sha-256
db_user_namespace = off

# Logging - Security Events
# --------------------------
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB

# What to log
log_connections = on
log_disconnections = on
log_duration = off
log_line_prefix = '%m [%p] %q%u@%d from %h '
log_timezone = 'UTC'

# Log authentication failures and errors
log_error_verbosity = default
log_min_messages = warning
log_min_error_statement = error

# Statement logging for auditing
log_statement = 'ddl'  # Log all DDL statements (CREATE, ALTER, DROP)

# Lock and deadlock logging
log_lock_waits = on
deadlock_timeout = 1s

# Checksum and data integrity
# ----------------------------
data_checksums = on  # Must be enabled at initdb time

# Resource Limits (prevent DoS)
# ------------------------------
shared_buffers = 256MB
work_mem = 4MB
maintenance_work_mem = 64MB
effective_cache_size = 1GB
max_wal_size = 2GB
min_wal_size = 1GB

# Statement timeout (prevent runaway queries)
statement_timeout = 300000  # 5 minutes
lock_timeout = 60000        # 1 minute
idle_in_transaction_session_timeout = 600000  # 10 minutes

# Security-related parameters
# ----------------------------
# Prevent execution of arbitrary code
allow_system_table_mods = off

# Disable dangerous extensions by default
shared_preload_libraries = 'pg_stat_statements'

# Client connection settings
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6

# Autovacuum (prevent bloat and performance issues)
# --------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50

# Performance monitoring
# ----------------------
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all

# pg_stat_statements for query analysis
pg_stat_statements.max = 10000
pg_stat_statements.track = all
