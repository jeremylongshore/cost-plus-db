# Fail2Ban Filter Configuration for PostgreSQL
# ==============================================
#
# This filter detects authentication failures and security-related events
# in PostgreSQL log files
#
# Installation:
#   sudo cp postgresql.conf /etc/fail2ban/filter.d/postgresql.conf
#   sudo systemctl restart fail2ban
#

[Definition]

# Match failed password authentication attempts
# Example: 2025-10-19 12:34:56.789 UTC [1234] FATAL: password authentication failed for user "testuser"
failregex = ^.*\[<HOST>\].*FATAL:\s+password authentication failed for user ".*"$
            ^.*\[<HOST>\].*FATAL:\s+no pg_hba\.conf entry for host ".*", user ".*", database ".*".*$
            ^.*\[<HOST>\].*FATAL:\s+role ".*" does not exist$
            ^.*\[<HOST>\].*FATAL:\s+database ".*" does not exist$
            ^.*\[<HOST>\].*FATAL:\s+invalid connection string$
            ^.*\[<HOST>\].*ERROR:\s+password authentication failed.*$

# Ignore these patterns (normal operations)
ignoreregex =

# Date pattern for PostgreSQL logs
# Format: 2025-10-19 12:34:56.789 UTC
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S

# Test this filter with:
# sudo fail2ban-regex /var/log/postgresql/postgresql-16-main.log /etc/fail2ban/filter.d/postgresql.conf
