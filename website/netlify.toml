# Netlify configuration for CostPlusDB

[build]
  publish = "."

# Form submission success redirect
[[redirects]]
  from = "/database-request"
  to = "/thank-you.html"
  status = 200
  force = false

# Redirect rules
[[redirects]]
  from = "/docs"
  to = "/transparency/"
  status = 301

[[redirects]]
  from = "/signup"
  to = "/calculator.html"
  status = 301

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache static assets
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML pages - no cache
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
