# Netlify configuration for CostPlusDB
# This file must be at the root of the repository

[build]
  publish = "website"

# ============================================================================
# NETLIFY FUNCTIONS
# ============================================================================
[functions]
  directory = "website/netlify/functions"

# ============================================================================
# FORM NOTIFICATIONS (via Netlify Event + Resend API + Slack)
# ============================================================================
# Automatically trigger notification function when form is submitted

# Netlify will automatically call /.netlify/functions/form-notify
# when the consultation-request form is submitted

# SETUP REQUIRED (in Netlify Dashboard UI):
# 1. Go to: Site settings → Build & deploy → Environment variables
# 2. Add variable: RESEND_API_KEY = your_resend_api_key (you already have this!)
# 3. (Optional) Add variable: SLACK_WEBHOOK_URL = https://hooks.slack.com/services/...

# To create Slack webhook:
# - Go to: https://api.slack.com/apps → Create New App → Incoming Webhooks
# - Enable webhooks, add to workspace, copy URL
# - Paste URL into SLACK_WEBHOOK_URL environment variable

# To trigger function on form submission, add to form HTML:
# <form name="consultation-request" method="POST"
#       netlify-honeypot="bot-field"
#       action="/.netlify/functions/form-notify">
#   ...
# </form>

# Form submission success redirect
[[redirects]]
  from = "/database-request"
  to = "/thank-you.html"
  status = 200
  force = false

# Redirect rules
[[redirects]]
  from = "/docs"
  to = "/transparency/"
  status = 301

[[redirects]]
  from = "/signup"
  to = "/calculator.html"
  status = 301

# Headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache static assets
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML pages - no cache
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
